# The workflow kit's own check: the vendored copy matches its lock, the profile
# is valid. Add its job name ("workflow kit") to the ruleset's required checks
# and to ci.required_checks in .claude/workflow/profile.toml. Setup replaces
# BASE_BRANCH with the profile's project.base_branch. merge_group runs it for
# a merge queue too, and does nothing without one.
name: workflow kit
on:
  pull_request:
  merge_group:
  push:
    branches: [BASE_BRANCH]

# Read-only: the job only reads the checkout.
permissions:
  contents: read

jobs:
  workflow-kit:
    name: workflow kit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -B .claude/workflow/bin/workflow.py profile check
      - run: python3 -B .claude/workflow/bin/workflow.py vendor verify --strict
