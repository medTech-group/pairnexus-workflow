# The project's workflow profile: what the kit's skills, hooks and scripts read
# instead of anything hard-coded. `setup-workflow` writes it; `workflow profile
# check` validates it. Lives at .claude/workflow/profile.toml.
#
# Prose (safety rules by reference, data classification, secrets, wording)
# goes in profile.md beside it.

[project]
name = "pairnexus-workflow"
repo = "medTech-group/pairnexus-workflow" # GitHub owner/repo of the issue tracker
base_branch = "main"
owner = "raj-attur-pair"                # optional: the owner's GitHub login, without the @
# Where the project's own rules live. Reviewers read these; nothing is copied.
rules = ["CLAUDE.md", "CONTRIBUTING.md"] # e.g. "CLAUDE.md#safety-constraints"
# Optional project-specific addendum read with the kit's flow.
flow_addendum = ""                      # e.g. "docs/agents/flow-addendum.md"
# The guided start: at the first message of an attended session, Claude asks
# what we're working on, with choices (skills/start). false turns it off;
# /start still works.
guided_start = true

[commands]
# The project's own dependencies, from the repository's files: e.g.
# "npm ci", "python3 -m venv .venv && .venv/bin/pip install -r requirements.txt",
# or "" when there's nothing to install. Run at a cloud session's start (the
# kit's hook) when setup_check fails, since a cloud session starts from a fresh
# clone. It never runs without setup_check, and must finish in about 8 minutes.
setup = "python3 -m pip install -q pytest"
setup_check = "python3 -c 'import pytest'"  # exits 0 when setup has run, e.g. "test -d node_modules"
typecheck = ""                          # "" when the project has none
test_file = "python3 -m pytest {file} -q"  # one test file: "{file}" is replaced

# Optional: parts of the project with their own typecheck or one-file test
# command. Sessions get every package's command with the files it covers, plus
# the top-level one above (for everything else).
# [[commands.package]]
# name = "web"
# path = "web/**"                       # a glob relative to the project root: the files it covers
# typecheck = "npx tsc --noEmit"
# test_file = "npx jest {file}"
# cwd = "web"                           # optional: run there (relative to the project root)

# The full suite, as one or more suites. Each runs in shards so a container
# restart loses at most one shard (`workflow evidence` resumes by head SHA).
[[commands.suite]]
name = "unit"
run = "python3 -m pytest {files} -q"    # {files}: the shard's files, space-separated (required when files is set)
files = "tests/test_*.py"               # glob(s) relative to the project root (even when cwd is set),
                                        # comma-separated; "" runs `run` once
group = 8                               # files per shard
cwd = ""                                # optional: run in this directory (relative to the project root);
                                        # {files} are then given relative to it
# Regexes for the counts, matched in the runner's summary: for pytest its
# summary line ("=== 1 failed, 2 passed in 0.5s ===", or a final "3 passed in
# 0.1s"); otherwise the last 5 non-empty lines of stdout (else of stderr),
# ANSI colours and report hints ("To open last HTML report") left out. Each
# match is summed. A shard that exits 0 with nothing counted is a failure: the
# regexes didn't match (one whose tests were all skipped counts zero tests).
# Optional `total`: a regex for a total that includes skips and failures; when
# set, passed = total - skipped - failed - errors. The defaults fit pytest.
# For other runners:
#   jest (prints its summary to stderr; "Tests: 1 failed, 2 skipped, 10 passed, 13 total"):
#     passed = 'Tests:.*?(\d+) passed'   failed = 'Tests:.*?(\d+) failed'
#     skipped = 'Tests:.*?(\d+) skipped'  errors = 'Test Suites:.*?(\d+) failed'
#   flutter test (progress lines like "00:05 +12 ~1 -2: ..."; match only the final one,
#   since a bare '\+(\d+)' would add up every progress line in the window):
#     passed = '\+(\d+)[^:]*: (?:All tests passed|Some tests failed)'
#     failed = '-(\d+): Some tests failed'
#     skipped = '~(\d+)[^:]*: (?:All tests passed|Some tests failed)'
#     errors: keep the default (flutter prints no error count; a file that fails to load exits nonzero)
#   go (plain `go test` prints no counts; run it through gotestsum, whose last line is
#   "DONE 42 tests, 1 skipped, 2 failures in 3.2s"; the 42 includes the failures and skips,
#   so give it as `total` and passed is worked out):
#     run = "gotestsum --format pkgname -- {files}"
#     total = 'DONE (\d+) tests'   failed = '(\d+) failures?'   skipped = '(\d+) skipped'   errors = '(\d+) errors?'
#   Playwright (list, line or dot reporter: "  1 failed", "  2 skipped", "  10 passed (30s)"):
#     passed = '(\d+) passed'   failed = '(\d+) failed'   skipped = '(\d+) skipped'
#     errors = '(\d+) errors? was not a part of any test'
#     The failing tests are listed under "N failed", so with many failures that line can scroll
#     out of the last 5; the shard still fails on its exit code.
passed = '(\d+) passed'
failed = '(\d+) failed'
skipped = '(\d+) skipped'
errors = '(\d+) errors?'

[ci]
# Required checks on the base branch, as their names show on a PR.
required_checks = ["tests (3.11)", "tests (3.12)", "tests (3.13)", "workflow kit", "release gate"]
# No CI at all? Then the local full suite (`workflow evidence`) is the merge gate,
# and every run report says "add CI".
none = false
# Required checks a workflow's `paths`/`paths-ignore` can skip, so a PR may never
# get them (e.g. a docs-only change). The session notes it rather than waiting.
path_filtered = []
# What counts as "killed, not failed" when the owner waives a named check.
killed_markers = ["exit code 143", "The runner has received a shutdown signal", "The operation was canceled"]

[ui]
# browser: drive the app in Chromium with Playwright; api: exercise the HTTP
# API; cli: run the command line; none: no explorer.
explorer = "cli"
start = []                              # commands that start the stack and app(s)
sizes = ["390x844", "1280x800"]         # phone and desktop
notes = "The CLI is python3 -B scripts/workflow.py (the kit's source); the vendored copy in .claude/workflow/bin is the release sessions run under."

[guard]
# Paths a ticket session may not change (and a conductor only by a reviewed PR).
# Ticket sessions also never change .git/config or .git/hooks. Never protected,
# whatever is listed: .env.example, .env.sample, .env.template, .claude/worktrees/.
# A list here replaces the defaults: keep these six and add yours.
# This repository adds its release files: merging a VERSION bump publishes a release.
protected_paths = [".claude/**", ".github/workflows/**", ".github/CODEOWNERS", "CODEOWNERS", "**/.env", "**/.env.*", "VERSION", ".claude-plugin/**", ".github/scripts/**"]
# Commands only the owner, or the conductor under a release grant, may run.
# A script (a path) is matched however it is run; others by their first words.
deploy_commands = []                    # e.g. ["scripts/deploy.sh", "terraform apply", "kubectl apply"]
# Test files: where a new skip marker is refused in ticket sessions.
test_paths = ["**/test_*.py", "**/*_test.py", "**/*.test.*", "**/*.spec.*", "**/*_test.dart", "**/*_test.go", "**/conftest.py"]
allow_new_skips = false

[sensitive]
# What must never appear in issues, comments, PR bodies or notifications.
description = "Secrets and personal data. The kit handles none of its own; examples are made up."
# Regexes checked against every outward GitHub post (issue, comment, PR body),
# heredocs and body files included. Anchor them so ordinary words don't match
# (the sk- pattern must not fire on "disk-usage-reporting-in-dashboards").
patterns = ['(?i)aws_secret_access_key\s*[:=]', '-----BEGIN [A-Z ]*PRIVATE KEY-----', 'ghp_[A-Za-z0-9]{36}', '(?<![A-Za-z0-9])sk-(?:proj-|ant-)?[A-Za-z0-9_-]{20,}']

# Areas ("lanes"): tickets carry `Area: <name>`; the conductor runs at most one
# session per area unless the run state records an override. Globs are hints.
# The kit's tickets name these areas; an area's files that don't exist yet are left out.
[areas]
profile = ["scripts/workflow/profile.py", "templates/profile.*", "docs/profile.md"]
protection = []                         # the files come with #44 and #66
guard = ["scripts/workflow/guard.py", "docs/enforcement.md"]
hooks = ["hooks/**", "scripts/workflow/_old_python.py", "scripts/workflow/context.py", "scripts/workflow/vendor.py"]
doctor = ["scripts/workflow/status.py"]
setup = ["skills/setup-workflow/**", "skills/update-workflow/**", "docs/install.md", "templates/github/**"]
start = ["skills/start/**", "skills/next/**"]
conductor = ["skills/conductor/**", "scripts/workflow/charter.py", "scripts/workflow/state.py", "scripts/workflow/render.py", "docs/charter.md", "templates/ticket-session-prompt.md"]
docs = ["README.md", "docs/*.md", "CONTRIBUTING.md"]
review = ["skills/review-panel/**", "agents/**"]
merge-check = []                        # the files come with #80 and #84
build = ["skills/build-ticket/**"]
release = [".github/**", "CHANGELOG.md"]
previews = []                           # the files come with #113

[repair]
# Re-runnable environment repair: SessionStart, `workflow repair`, and before
# each evidence shard. Each must be safe to run twice.
commands = []                           # e.g. ["pgrep dockerd || (nohup dockerd >/tmp/dockerd.log 2>&1 &)"]

[release]
# Deploys and builds after merges. Each runs only under a release grant in the
# run charter, and is logged in the outward-changes ledger.
# [[release.steps]]
# name = "deploy staging"
# run = "scripts/deploy.sh staging"
# smoke = "scripts/smoke.sh staging"

[run]
ticket_branch = "claude/build-*"        # ticket sessions' branches (role fallback)
check_in_minutes = 20
max_parallel = 2
max_retries = 1
review_rounds = 3
# The claude.ai environments, by name (docs/enforcement.md section 2).
ticket_environment = "workflow-ticket"  # no credentials; WORKFLOW_ROLE=ticket
conductor_environment = "workflow-conductor" # WORKFLOW_ROLE=conductor; release credentials only if wanted
# The environments' setup script: only machine-level tools the cloud image
# lacks (it has Python, Node, Java, Go, Rust, Ruby, PHP, Docker, PostgreSQL,
# Redis). It runs before Claude starts, and must not read the repository's
# files: a script that does fails, and no session can start. Usually "".
environment_setup = ""
# Ticket sessions' permission mode: one that never prompts (auto;
# bypassPermissions in a sandbox; dontAsk or acceptEdits only with allow rules
# for the commands sessions run, since acceptEdits still asks before a shell
# command). No more permissive than the conductor session's own mode.
permission_mode = "auto"
