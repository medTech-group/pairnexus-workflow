# The "release gate" check (#88): on every pull request, `release gate` passes at once when the PR
# doesn't change VERSION; on a release PR it passes only when a gate report from an account with
# write access says pass for the PR's exact head commit, or the skip is allowed
# (.github/scripts/release_gate.py, taken from the base branch, so a PR can't change the script
# that judges it). Everything about the PR is read from the API when the job runs, never from the
# event's payload, since a re-run replays the original event. A comment on a PR re-runs its latest
# `release gate` run for the head commit, so the PR keeps one check and nobody needs an empty push.
# A change to this file or the script is reviewed as CI config.
name: release gate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:
  gate:
    name: release gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      DATA: /tmp/release-gate
    steps:
      - name: Read the pull request, its files and the gate's script
        id: pr
        run: |
          mkdir -p "$DATA"
          # raw <path> <ref> <out>: a file at a commit or branch. Only a 404 (no such file) gives an
          # empty file; any other error fails the step.
          cat > "$DATA/raw.sh" <<'EOF'
          raw() {
            if ! gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/$1?ref=$2" > "$3" 2> "$DATA/err"; then
              grep -q "HTTP 404" "$DATA/err" || { cat "$DATA/err" >&2; return 1; }
              : > "$3"
            fi
          }
          EOF
          . "$DATA/raw.sh"
          gh api "repos/$REPO/pulls/$PR" > "$DATA/pr.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$PR/files?per_page=100" > "$DATA/files.json"
          head=$(jq -r .head.sha "$DATA/pr.json")
          # The base branch as it is now, by name: the last release is on it.
          base=$(jq -r '.base.ref | @uri' "$DATA/pr.json")
          {
            echo "head=$head"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
          # The base branch's script judges; the PR's own only while the base has none.
          raw .github/scripts/release_gate.py "$base" "$DATA/release_gate.py"
          [ -s "$DATA/release_gate.py" ] || raw .github/scripts/release_gate.py "$head" "$DATA/release_gate.py"
          if jq -e '[.[][] | .filename, .previous_filename] | index("VERSION")' "$DATA/files.json" > /dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Read the comments, their authors' permissions, the CHANGELOG and VERSION
        if: steps.pr.outputs.release == 'true'
        env:
          HEAD: ${{ steps.pr.outputs.head }}
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          . "$DATA/raw.sh"
          gh api --paginate --slurp "repos/$REPO/issues/$PR/comments?per_page=100" > "$DATA/comments.json"
          # Only marked comments can count, so only their authors are looked up. An author whose
          # permission can't be read is left out, and counts as without write access.
          echo '{}' > "$DATA/permissions.json"
          jq -r '[.[][] | select(.body // "" | contains("<!-- workflow:agent -->")) | .user.login] | unique | .[]' \
            "$DATA/comments.json" | while read -r login; do
            if perm=$(gh api "repos/$REPO/collaborators/$login/permission" --jq .permission); then
              jq --arg l "$login" --arg p "$perm" '. + {($l): $p}' "$DATA/permissions.json" > "$DATA/p.json"
              mv "$DATA/p.json" "$DATA/permissions.json"
            else
              echo "couldn't read $login's permission: their comments don't count"
            fi
          done
          raw CHANGELOG.md "$HEAD" "$DATA/changelog"
          raw CHANGELOG.md "$BASE" "$DATA/changelog-base"
          raw VERSION "$HEAD" "$DATA/version-head"
          raw VERSION "$BASE" "$DATA/version-base"
      - name: Decide
        run: |
          args=(--pr "$DATA/pr.json" --files "$DATA/files.json")
          if [ -f "$DATA/comments.json" ]; then
            for f in comments permissions; do args+=("--$f" "$DATA/$f.json"); done
            for f in changelog changelog-base version-head version-base; do args+=("--$f" "$DATA/$f"); done
          fi
          set +e
          out=$(python3 -I "$DATA/release_gate.py" "${args[@]}")
          code=$?
          echo "$out"
          echo "$out" >> "$GITHUB_STEP_SUMMARY"
          exit $code

  rerun:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One at a time per PR: a newer comment's job replaces one still waiting.
    concurrency:
      group: release-gate-rerun-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
    steps:
      - name: Re-run the latest release gate run for the head commit
        run: |
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          runs="repos/$REPO/actions/workflows/release-gate.yml/runs?event=pull_request&head_sha=$head&per_page=1"
          # A run still going may have read the comments already: wait for it, then run it again.
          for _ in $(seq 30); do
            run=$(gh api "$runs" --jq '.workflow_runs[0] | "\(.id) \(.status)"')
            if [ -z "$run" ] || [ "$run" = "null null" ]; then
              echo "no release gate run for $head yet"
              exit 0
            fi
            [ "${run#* }" = completed ] && break
            sleep 10
          done
          if [ "${run#* }" != completed ]; then
            echo "release gate run ${run%% *} for $head is still going after 5 minutes: not re-run" >&2
            exit 1
          fi
          id=${run%% *}
          gh api -X POST "repos/$REPO/actions/runs/$id/rerun"
          echo "re-ran release gate run $id for $head"
